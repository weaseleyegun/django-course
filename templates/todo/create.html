{% extends 'base.html' %}

{% block content %}
    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        .submit-btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }

        .submit-btn:hover {
            background-color: #218838;
        }
    </style>
    <h1>Todo Create</h1>
    <div class="container">
        <h1>Create a New Todo</h1>

        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" maxlength="100" required>
        </div>
        <div>
            <label for="description">Description:</label>
            <textarea id="description" name="description" rows="4"></textarea>
        </div>
        <div>
            <label for="complete">Complete:</label>
            <input type="checkbox" id="complete" name="complete">
        </div>
        <div>
            <label for="exp">Experience Points:</label>
            <input type="number" id="exp" name="exp" min="0" value="0" required>
        </div>
        <button type="submit" id="todoCreate" class="submit-btn">Create Todo</button>
    </div>

    <script>
    //버튼이 클릭된다면 axios를 통해 보낸다. document 또는 jquery 사용
        //document.querySelector("#todoCreate").addEventListener("click", function(){ 
        $('#todoCreate').on("click", function(){
            axiosInstance.post("/api/todo/generics/create/", {
                name : $("#name").val(),
                description: $("#description").val(),
                complete: $("#complete").val() === "ON",
                exp: $("#exp").val()

            })
            .then(function(response){ //요청에 성공했을때
                window.location.href="/todo/list";
            })
            .catch(function(error){ //요청에 실패했을때
                console.log(error)
                alert("Todo 생성에 실패했습니다.");
            })
        
        })
            {% comment %} axiosInstance.post("/api/todo/generics/create/", {
                name : "test Todo in axios"
            })
            .then(function(response){ //요청에 성공했을때
                console.log(response)
            })
            .catch(function(error){ //요청에 실패했을때
                console.log(error)
            })
        }) {% endcomment %}

    </script>

{% endblock %}
