<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Todo List</title>

</head>
<body>
    <h1>Todo List</h1>

    <!-- 전체 todos 출력 제거 (필요 없음) -->
    <!-- {{todos}} -->

    <div class="todo-container">
        {% for todo in todos %}
            <div class="todo-item">
                <div class="todo-name">{{ todo }}</div>
                <div class="description">{{ todo.description }}</div>
                <div class="complete">완료: {{ todo.complete }}</div>
                <div class="created">생성: {{ todo.created_at }}</div>
            </div>
        {% empty %}
            <p>할 일이 없습니다.</p>
        {% endfor %}
    </div>

    <div class="extra-info">
        <p><strong>첫 번째 항목:</strong> {{ first|default:"없음" }}</p>
        <p><strong>마지막 항목:</strong> {{ last|default:"없음" }}</p>
    </div>
</body>
</html>
